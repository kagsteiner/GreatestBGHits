<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Second Roll - Friendly match</title>
  <link rel="stylesheet" href="quiz.css">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <script>
    (function () {
      var theme = localStorage.getItem('sr-theme');
      if (theme === 'classic') document.documentElement.setAttribute('data-theme', 'classic');
    })();
  </script>
</head>

<body class="play-page split-page">
  <script>
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'classic' ? 'dark' : 'classic';
      localStorage.setItem('sr-theme', next);
      if (next === 'classic') document.documentElement.setAttribute('data-theme', 'classic');
      else document.documentElement.removeAttribute('data-theme');
      if (typeof window.refreshPlayLabels === 'function') window.refreshPlayLabels();
    }
  </script>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1>Second Roll<span class="to-move"> - friendly match</span></h1>
        <div id="matchInfo" class="match-info"></div>
      </div>
      <label class="fast-move-toggle" title="Click a checker to move it by the first die, click again for the second. ⇄ next to the dice (or S) swaps them.">
        <input type="checkbox" id="fastMoveToggle">
        Fast moves
      </label>
      <button class="theme-toggle" onclick="toggleTheme()" title="Switch theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <path stroke-linecap="round"
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
        <svg class="icon-board" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </button>
    </header>

    <main class="layout">
      <section class="board-area">
        <div class="board-container">
          <div class="point-numbers point-numbers-top" id="point-numbers-top"></div>
          <div class="board" id="board">
            <div class="bearoff bearoff-left">
              <div class="cube" id="cube">1</div>
            </div>
            <div class="points">
              <div class="points-row points-top" id="points-top"></div>
              <div class="center-strip">
                <div class="dice" id="dice"></div>
              </div>
              <div class="points-row points-bottom" id="points-bottom"></div>
            </div>
            <div class="bearoff bearoff-right">
              <div class="bearoff-p2" id="bearoff-p2">0</div>
              <div class="pipcount pipcount-p2" id="pipcount-p2">0</div>
              <div class="bearoff-p1" id="bearoff-p1">0</div>
              <div class="pipcount pipcount-p1" id="pipcount-p1">0</div>
            </div>
          </div>
          <div class="point-numbers point-numbers-bottom" id="point-numbers-bottom"></div>
        </div>
      </section>

      <div class="split-handle" id="friendSplitter" role="separator" aria-orientation="vertical"
        aria-label="Resize board and side panel (double-click to reset)" tabindex="0"></div>

      <section class="quiz-area play-area friend-area">
        <form class="play-key" id="keyForm" hidden>
          <label for="keyInput" class="quiz-question">Access key</label>
          <input type="password" id="keyInput" class="quiz-id-input" autocomplete="off" required>
          <button type="submit">Continue</button>
        </form>

        <form class="play-key" id="joinForm" hidden>
          <label for="nameInput" class="quiz-question">Your name</label>
          <input type="text" id="nameInput" class="quiz-id-input" maxlength="20" autocomplete="nickname" required>
          <button type="submit">Sit down</button>
          <div class="meta" id="joinMessage"></div>
        </form>

        <div id="friendPanel" hidden>
          <div class="friend-players" id="friendPlayers"></div>

          <div id="lobby" hidden>
            <div class="quiz-question" id="lobbyStatus"></div>
            <div class="friend-lengths" id="lengthButtons"></div>
            <div class="meta" id="lobbyMeta"></div>
          </div>

          <div id="gameView" hidden>
            <div class="quiz-question" id="playStatus"></div>
            <div class="play-controls">
              <button type="button" id="rollBtn" title="Roll the dice (R)" hidden>Roll</button>
              <button type="button" id="doubleBtn" class="secondary" hidden>Double</button>
              <button type="button" id="doneBtn" title="Finish your move (Enter)" hidden disabled>Done</button>
              <button type="button" id="undoBtn" class="secondary" title="Take back the last checker move (U)" hidden>Undo</button>
              <button type="button" id="takeBtn" hidden>Take</button>
              <button type="button" id="passBtn" class="secondary" hidden>Pass</button>
              <button type="button" id="nextGameBtn" hidden>Next game</button>
            </div>
            <div class="play-feedback" id="playFeedback"></div>
            <ol class="play-log" id="playLog"></ol>
          </div>

          <div class="play-account">
            <button type="button" class="link-button" id="historyBtn">Our matches</button>
            <button type="button" class="link-button" id="renameBtn">Change name</button>
            <button type="button" class="link-button" id="abortBtn" hidden>Abort match</button>
            <button type="button" class="link-button" id="leaveBtn">Leave the table</button>
          </div>
        </div>

        <div class="play-history" id="historyView" hidden>
          <div class="play-history-head">
            <span class="quiz-question">Our matches</span>
            <button type="button" class="secondary" id="historyCloseBtn">Back</button>
          </div>
          <div class="meta" id="historySummary"></div>
          <div class="friend-history" id="historyList"></div>
          <div id="markedView" hidden>
            <div class="play-history-head">
              <span class="quiz-question" id="markedTitle"></span>
            </div>
            <div class="meta" id="markedMeta"></div>
            <div class="play-controls">
              <select id="depthSelect" class="training-mode-select" aria-label="Analysis depth"></select>
              <button type="button" id="analyseBtn">Analyse</button>
              <span class="meta" id="analysisStatus"></span>
            </div>
            <div id="analysisResults"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="shared/ogid.js"></script>
  <script src="shared/checkerPlay.js"></script>
  <script src="shared/analysisText.js"></script>
  <script type="module" src="friend.js"></script>
</body>

</html>
