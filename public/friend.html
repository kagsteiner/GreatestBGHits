<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Second Roll - Friendly match</title>
  <link rel="stylesheet" href="quiz.css">
  <link rel="stylesheet" href="boardPage.css">
  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">

  <!-- Android Home Screen icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script src="theme.js"></script>
</head>

<body class="board-page">
  <div id="app">
    <header class="app-header">
      <template data-settings>
        <label class="menu-row" title="Dice and checker sounds">
          <input type="checkbox" id="soundToggle" checked>
          Sound
        </label>
        <label class="menu-row" title="A voice says &quot;awesome&quot; when a player makes the best move: Luna and Theo say it calmly, Sunny and Max with gusto">
          Speech
          <select id="speechSelect" class="speech-select">
            <option value="none">none</option>
            <option value="luna" title="relaxed">Luna</option>
            <option value="theo" title="relaxed">Theo</option>
            <option value="female" title="enthusiastic">Sunny</option>
            <option value="male" title="enthusiastic">Max</option>
          </select>
        </label>
      </template>
    </header>

    <main class="layout">
      <section class="board-area"></section>

      <div class="split-handle" role="separator" aria-orientation="vertical"
        aria-label="Resize board and panel (double-click to reset)" tabindex="0"></div>

      <section class="panel">
        <form class="play-key" id="keyForm" hidden>
          <label for="keyInput" class="quiz-question">Access key</label>
          <input type="password" id="keyInput" class="quiz-id-input" autocomplete="off" required>
          <button type="submit">Continue</button>
        </form>

        <form class="play-key" id="joinForm" hidden>
          <label for="nameInput" class="quiz-question">Your name</label>
          <input type="text" id="nameInput" class="quiz-id-input" maxlength="20" autocomplete="nickname" required>
          <button type="submit">Sit down</button>
          <div class="meta" id="joinMessage"></div>
        </form>

        <div id="friendPanel" hidden>
          <div class="friend-players" id="friendPlayers" data-full-only></div>

          <div id="lobby" hidden>
            <div class="quiz-question" id="lobbyStatus"></div>
            <div class="friend-lengths" id="lengthButtons"></div>
            <div class="meta" id="lobbyMeta"></div>
          </div>

          <div id="gameView" hidden>
            <div class="quiz-question" id="playStatus"></div>
            <div class="play-controls">
              <button type="button" id="rollBtn" title="Roll the dice (R)" hidden>Roll</button>
              <button type="button" id="doubleBtn" class="secondary" hidden>Double</button>
              <button type="button" id="doneBtn" title="Finish your move (Enter or R)" hidden disabled>Done</button>
              <button type="button" id="undoBtn" class="secondary" title="Take back the last checker move (U or E)" hidden>Undo</button>
              <button type="button" id="takeBtn" hidden>Take</button>
              <button type="button" id="passBtn" class="secondary" hidden>Pass</button>
              <button type="button" id="nextGameBtn" hidden>Next game</button>
            </div>
            <div class="play-feedback" id="playFeedback"></div>
            <ol class="play-log" id="playLog" data-full-only></ol>
          </div>

          <div class="play-account" data-full-only>
            <a class="link-button" id="analyseLink" href="review.html?friend=running" title="Step through the decisions made so far and analyse them" hidden>Analyse this match</a>
            <button type="button" class="link-button" id="historyBtn">Our matches</button>
            <button type="button" class="link-button" id="renameBtn">Change name</button>
            <button type="button" class="link-button" id="abortBtn" hidden>Abort match</button>
            <button type="button" class="link-button" id="leaveBtn">Leave the table</button>
          </div>
        </div>

        <div class="play-history" id="historyView" hidden>
          <div class="play-history-head">
            <span class="quiz-question">Our matches</span>
            <button type="button" class="secondary" id="historyCloseBtn">Back</button>
          </div>
          <div class="meta" id="historySummary"></div>
          <div class="friend-history" id="historyList"></div>
          <div id="markedView" hidden>
            <div class="play-history-head">
              <span class="quiz-question" id="markedTitle"></span>
            </div>
            <div class="meta" id="markedMeta"></div>
            <div id="analysisPanel"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="engine/bghelmet.js"></script>
  <script src="shared/engineBudget.js"></script>
  <script src="engineBridge.js"></script>
  <script src="shared/ogid.js"></script>
  <script src="shared/checkerPlay.js"></script>
  <script src="shared/analysisText.js"></script>
  <script type="module" src="friend.js"></script>
</body>

</html>
