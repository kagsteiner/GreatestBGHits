<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Second Roll - Quiz</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="boardPage.css">
  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">

  <!-- Android Home Screen icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script src="theme.js"></script>
</head>

<body class="board-page">
  <div id="app">
    <header class="app-header">
      <div class="header-tools">
        <div class="quiz-filter" id="quizFilter">
          <button type="button" id="filterBtn" class="filter-button" aria-expanded="false" aria-controls="filterPanel">
            <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5Z" />
            </svg>
            <span class="filter-label">Filter</span>
            <span class="filter-summary" id="filterSummary">All</span>
          </button>
          <div class="filter-panel" id="filterPanel" role="dialog" aria-label="Quiz filter" hidden>
            <label class="filter-field">
              <span>Questions</span>
              <select id="trainingMode" class="training-mode-select">
                <option value="mixed">Checker + Cube</option>
                <option value="checker">Checker play</option>
                <option value="cube">Cube decisions</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Player</span>
              <select id="playerFilter" class="training-mode-select">
                <option value="">All players</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Match</span>
              <select id="matchFilter" class="training-mode-select">
                <option value="">All matches</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <template data-settings>
        <button id="flipBoardBtn" type="button" class="menu-row menu-button" title="Flip board vertically">⇵ Flip board</button>
        <button id="lockBoardBtn" type="button" class="menu-row menu-button lock-btn" title="Lock board so mover's home is always at bottom" aria-pressed="false">🔓 Lock</button>
      </template>
    </header>

    <main class="layout">
      <section class="board-area"></section>

      <div class="split-handle" role="separator" aria-orientation="vertical"
        aria-label="Resize board and panel (double-click to reset)" tabindex="0"></div>

      <section class="panel">
        <div class="admin-notice" id="adminNotice" style="display:none;"></div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="meta" id="meta" data-full-only></div>
        <form id="options" class="options"></form>
        <div class="board-play" id="boardPlay" hidden>
          <span class="board-play-status" id="boardPlayStatus" role="status" aria-live="polite"></span>
          <button type="button" id="boardUndoBtn" class="secondary board-play-button">Undo</button>
          <button type="button" id="boardResetBtn" class="secondary board-play-button">Reset</button>
        </div>
        <div class="actions">
          <button id="rateBtn" disabled>Rate my guess</button>
          <button id="ignoreBtn" type="button" class="secondary">Ignore</button>
          <button id="nextBtn" class="secondary" style="display:none;">Next</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="external-link-container" id="externalLinkContainer" data-full-only style="display:none;">
          <button id="analysisBtn" type="button" class="external-link-button deep-analysis-button"
            aria-expanded="false" aria-controls="analysisPanel">
            Analysis
          </button>
          <a id="dgLink" href="#" target="_blank" rel="noopener noreferrer" class="external-link-button">
            View on DailyGammon
          </a>
        </div>
        <div id="analysisPanel" data-full-only></div>
      </section>
    </main>
  </div>

  <script src="engine/bghelmet.js"></script>
  <script src="shared/engineBudget.js"></script>
  <script src="engineBridge.js"></script>
  <script src="auth.js"></script>
  <script src="shared/ogid.js"></script>
  <script src="shared/quizEvaluation.js"></script>
  <script src="shared/checkerPlay.js"></script>
  <script src="shared/analysisText.js"></script>
  <script type="module" src="quiz.js"></script>
</body>

</html>
