<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Second Roll - Quiz</title>
  <link rel="stylesheet" href="quiz.css">
  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  
  <!-- Optional large icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script>
    // Apply saved theme immediately to prevent flash
    (function () {
      var theme = localStorage.getItem('sr-theme');
      if (theme === 'classic') document.documentElement.setAttribute('data-theme', 'classic');
    })();
  </script>
</head>

<body class="quiz-page split-page">
  <script>
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'classic' ? 'dark' : 'classic';
      localStorage.setItem('sr-theme', next);
      if (next === 'classic') {
        document.documentElement.setAttribute('data-theme', 'classic');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      // Update "to move" label for the new theme
      var toMove = document.getElementById('toMove');
      if (toMove && toMove.textContent.trim()) {
        var isClassic = next === 'classic';
        if (toMove.classList.contains('blue')) {
          toMove.textContent = isClassic ? ' - black to move' : ' - blue to move';
        } else if (toMove.classList.contains('red')) {
          toMove.textContent = isClassic ? ' - white to move' : ' - red to move';
        }
      }
      if (typeof window.refreshQuizLabels === 'function') {
        window.refreshQuizLabels();
      }
    }
  </script>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1>Second Roll<span id="toMove" class="to-move"></span></h1>
        <div id="matchInfo" class="match-info" style="display: none;"></div>
      </div>
      <div class="board-orientation-toggle">
        <button id="flipBoardBtn" type="button" class="board-orientation-button" title="Flip board vertically">
          ⇵ Board
        </button>
        <button id="lockBoardBtn" type="button" class="board-orientation-button lock-btn" title="Lock board so mover's home is always at bottom" aria-pressed="false">
          🔓 Lock
        </button>
      </div>
      <div class="quiz-filter" id="quizFilter">
        <button type="button" id="filterBtn" class="filter-button" aria-expanded="false" aria-controls="filterPanel">
          <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5Z" />
          </svg>
          <span class="filter-label">Filter</span>
          <span class="filter-summary" id="filterSummary">All</span>
        </button>
        <div class="filter-panel" id="filterPanel" role="dialog" aria-label="Quiz filter" hidden>
          <label class="filter-field">
            <span>Questions</span>
            <select id="trainingMode" class="training-mode-select">
              <option value="mixed">Checker + Cube</option>
              <option value="checker">Checker play</option>
              <option value="cube">Cube decisions</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Player</span>
            <select id="playerFilter" class="training-mode-select">
              <option value="">All players</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Match</span>
            <select id="matchFilter" class="training-mode-select">
              <option value="">All matches</option>
            </select>
          </label>
        </div>
      </div>
      <!-- Theme toggle in header -->
      <button class="theme-toggle" onclick="toggleTheme()" title="Switch theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <path stroke-linecap="round"
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
        <svg class="icon-board" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </button>
    </header>
    <div class="back-link-row">
      <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <main class="layout">
      <section class="board-area">
        <div class="board-container">
          <div class="point-numbers point-numbers-top" id="point-numbers-top"></div>
          <div class="board" id="board">
            <div class="bearoff bearoff-left">
              <div class="cube" id="cube">1</div>
            </div>
            <div class="points">
              <div class="points-row points-top" id="points-top"></div>
              <div class="center-strip">
                <div class="dice" id="dice"></div>
                <button id="mirrorBoardBtn" type="button" class="board-mirror-button" title="Mirror board horizontally">⇄</button>
              </div>
              <div class="points-row points-bottom" id="points-bottom"></div>
            </div>
            <div class="bearoff bearoff-right">
              <div class="bearoff-p2" id="bearoff-p2">0</div>
              <div class="pipcount pipcount-p2" id="pipcount-p2">0</div>
              <div class="bearoff-p1" id="bearoff-p1">0</div>
              <div class="pipcount pipcount-p1" id="pipcount-p1">0</div>
            </div>
          </div>
          <div class="point-numbers point-numbers-bottom" id="point-numbers-bottom"></div>
        </div>
      </section>

      <div class="split-handle" id="quizSplitter" role="separator" aria-orientation="vertical"
        aria-label="Resize board and side panel (double-click to reset)" tabindex="0"></div>

      <section class="quiz-area">
        <div class="admin-notice" id="adminNotice" style="display:none;"></div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="meta" id="meta"></div>
        <form id="options" class="options"></form>
        <div class="board-play" id="boardPlay" hidden>
          <span class="board-play-status" id="boardPlayStatus" role="status" aria-live="polite"></span>
          <button type="button" id="boardUndoBtn" class="secondary board-play-button">Undo</button>
          <button type="button" id="boardResetBtn" class="secondary board-play-button">Reset</button>
        </div>
        <div class="actions">
          <button id="rateBtn" disabled>Rate my guess</button>
          <button id="ignoreBtn" type="button" class="secondary">Ignore</button>
          <button id="nextBtn" class="secondary" style="display:none;">Next</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="external-link-container" id="externalLinkContainer" style="display:none;">
          <button id="analysisBtn" type="button" class="external-link-button deep-analysis-button"
            aria-expanded="false" aria-controls="quizAnalysis">
            Analysis
          </button>
          <a id="dgLink" href="#" target="_blank" rel="noopener noreferrer" class="external-link-button">
            View on DailyGammon
          </a>
        </div>
        <section class="quiz-analysis" id="quizAnalysis" hidden>
          <div class="review-analysis-controls" id="quizAnalysisControls" hidden>
            <select id="quizDepthSelect" class="training-mode-select" aria-label="Search depth"></select>
            <button type="button" id="quizAnalyseBtn">Analyse</button>
          </div>
          <div class="review-analysis-status" id="quizAnalysisStatus" role="status" aria-live="polite"></div>
          <div class="review-result" id="quizAnalysisResult"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="shared/ogid.js"></script>
  <script src="shared/quizEvaluation.js"></script>
  <script src="shared/checkerPlay.js"></script>
  <script src="shared/analysisText.js"></script>
  <script type="module" src="quiz.js"></script>
</body>

</html>
