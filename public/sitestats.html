<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Statistics - Backgammon Learning</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #111319;
      --muted: #9aa4b2;
      --text: #e6eaf2;
      --accent: #67b0ff;
      --accent-2: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1000px 800px at 70% -20%, #17202e 0%, var(--bg) 60%);
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 2rem;
      text-align: center;
    }
    .stats-table {
      background: var(--panel);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .error {
      color: var(--accent-2);
      text-align: center;
      padding: 2rem;
    }
    .total-row {
      font-weight: 600;
      background: rgba(103, 176, 255, 0.1);
    }
    .total-row td {
      border-top: 2px solid var(--accent);
      padding-top: 1rem;
    }
    h2 {
      color: var(--accent);
      margin: 2.5rem 0 1rem;
      font-size: 1.25rem;
    }
    .section-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    td.num, th.num {
      text-align: right;
    }
  </style>
  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  
  <!-- Optional large icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
  <div class="container">
    <h1>Site Statistics</h1>
    <div class="stats-table">
      <div id="loading" class="loading">Loading statistics...</div>
      <div id="error" class="error" style="display: none;"></div>
      <table id="stats-table" style="display: none;">
        <thead>
          <tr>
            <th>Username</th>
            <th>Number of Quizzes</th>
          </tr>
        </thead>
        <tbody id="stats-body">
        </tbody>
      </table>
    </div>

    <h2 id="activity-title" style="display:none">Activity — <span id="activity-month-label"></span></h2>
    <div class="stats-table" id="daily-panel" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th class="num">Quizzes Added</th>
            <th class="num">Quizzes Served</th>
            <th class="num">Logins</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>

    <h2 id="monthly-title" style="display:none">Monthly Totals</h2>
    <div class="stats-table" id="monthly-panel" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th class="num">Quizzes Added</th>
            <th class="num">Quizzes Served</th>
            <th class="num">Logins</th>
            <th class="num">Days</th>
            <th class="num">Added/Day</th>
            <th class="num">Served/Day</th>
          </tr>
        </thead>
        <tbody id="monthly-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('siteStats');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const stats = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        
        if (stats.length === 0) {
          document.getElementById('error').textContent = 'No users found in the database.';
          document.getElementById('error').style.display = 'block';
          return;
        }
        
        const tbody = document.getElementById('stats-body');
        let totalQuizzes = 0;
        
        stats.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${escapeHtml(user.username)}</td>
            <td>${user.quizCount}</td>
          `;
          tbody.appendChild(row);
          totalQuizzes += user.quizCount;
        });
        
        // Add total row
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
          <td>Total</td>
          <td>${totalQuizzes}</td>
        `;
        tbody.appendChild(totalRow);
        
        document.getElementById('stats-table').style.display = 'table';
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = `Error loading statistics: ${error.message}`;
        document.getElementById('error').style.display = 'block';
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function loadActivity() {
      try {
        const res = await fetch('activityStats');
        if (!res.ok) return;
        const data = await res.json();

        // --- Current month daily table ---
        const cm = data.currentMonth;
        if (cm && cm.days && cm.days.length > 0) {
          const label = formatMonth(cm.month);
          document.getElementById('activity-month-label').textContent = label;
          document.getElementById('activity-title').style.display = '';
          document.getElementById('daily-panel').style.display = '';

          const tbody = document.getElementById('daily-body');
          let sumAdded = 0, sumServed = 0, sumLogins = 0;
          cm.days.forEach(d => {
            sumAdded += d.quizzes_added;
            sumServed += d.quizzes_served;
            sumLogins += d.logins;
            const row = document.createElement('tr');
            row.innerHTML = `<td>${formatDate(d.date)}</td><td class="num">${d.quizzes_added}</td><td class="num">${d.quizzes_served}</td><td class="num">${d.logins}</td>`;
            tbody.appendChild(row);
          });
          const totalRow = document.createElement('tr');
          totalRow.className = 'total-row';
          totalRow.innerHTML = `<td>Total</td><td class="num">${sumAdded}</td><td class="num">${sumServed}</td><td class="num">${sumLogins}</td>`;
          tbody.appendChild(totalRow);
        }

        // --- Monthly summary table ---
        if (data.months && data.months.length > 0) {
          document.getElementById('monthly-title').style.display = '';
          document.getElementById('monthly-panel').style.display = '';
          const tbody = document.getElementById('monthly-body');
          data.months.forEach(m => {
            const avg = (v) => m.days > 0 ? (v / m.days).toFixed(1) : '-';
            const row = document.createElement('tr');
            row.innerHTML = `<td>${formatMonth(m.month)}</td><td class="num">${m.quizzes_added}</td><td class="num">${m.quizzes_served}</td><td class="num">${m.logins}</td><td class="num">${m.days}</td><td class="num">${avg(m.quizzes_added)}</td><td class="num">${avg(m.quizzes_served)}</td>`;
            tbody.appendChild(row);
          });
        }
      } catch (_) {
        // silently ignore activity errors
      }
    }

    function formatMonth(ym) {
      const [y, m] = ym.split('-');
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return names[parseInt(m, 10) - 1] + ' ' + y;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDate();
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return `${weekdays[d.getDay()]}, ${names[d.getMonth()]} ${day}`;
    }

    loadStats();
    loadActivity();
  </script>
</body>
</html>
