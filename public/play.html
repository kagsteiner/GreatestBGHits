<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Second Roll - Play</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="boardPage.css">
  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">

  <!-- Android Home Screen icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script src="theme.js"></script>
</head>

<body class="board-page">
  <div id="app">
    <header class="app-header"></header>

    <main class="layout">
      <section class="board-area"></section>

      <div class="split-handle" role="separator" aria-orientation="vertical"
        aria-label="Resize board and panel (double-click to reset)" tabindex="0"></div>

      <section class="panel">
        <form class="play-key" id="keyForm" hidden></form>

        <div id="playPanel" hidden>
          <div class="quiz-question" id="playStatus"></div>
          <div class="meta" id="playMeta" data-full-only></div>

          <div class="play-controls"></div>

          <div class="play-feedback" id="playFeedback"></div>

          <p class="meta engine-status" data-engine-status hidden></p>
          <form class="play-setup" id="setupForm">
            <label for="lengthSelect">Match to</label>
            <select id="lengthSelect" class="training-mode-select"></select>
            <span>points against</span>
            <select id="levelSelect" class="training-mode-select" aria-label="Engine level"></select>
            <button type="submit" id="startBtn" class="secondary">New match</button>
          </form>

          <div class="play-account" id="accountBar" data-full-only>
            <span id="accountStatus"></span>
            <a class="link-button" id="analyseLink" href="review.html?running=1" title="Step through the decisions made so far and analyse them" hidden>Analyse this match</a>
            <button type="button" class="link-button" id="historyBtn" hidden>My matches</button>
            <button type="button" class="link-button" id="loginBtn">Log in or register</button>
            <button type="button" class="link-button" id="logoutBtn" hidden>Log out</button>
          </div>
          <form class="play-login" id="loginForm" data-full-only hidden>
            <input type="text" id="loginName" class="quiz-id-input" placeholder="Name" autocomplete="username"
              autocapitalize="off" spellcheck="false" required>
            <input type="password" id="loginPassword" class="quiz-id-input" placeholder="Password"
              autocomplete="current-password" required>
            <div class="play-login-buttons">
              <button type="submit">Log in</button>
              <button type="button" id="registerBtn" class="secondary">Register</button>
              <button type="button" id="loginCancelBtn" class="secondary">Cancel</button>
            </div>
            <div class="meta" id="loginMessage">Register to keep statistics of your matches. No DailyGammon account needed.</div>
          </form>

          <ol class="play-log" id="playLog" data-full-only></ol>
        </div>

        <div class="play-history" id="historyView" hidden>
          <div class="play-history-head">
            <span class="quiz-question">My matches</span>
            <button type="button" class="secondary" id="historyCloseBtn">Back</button>
          </div>
          <div class="meta" id="historySummary"></div>
          <div class="play-history-table">
            <table>
              <thead>
                <tr><th>Started</th><th>Match</th><th>Result</th><th>PR</th><th title="Flagged of the decisions the PR counts">Errors</th><th></th></tr>
              </thead>
              <tbody id="historyRows"></tbody>
            </table>
          </div>
          <button type="button" class="secondary play-history-chart-button" id="prChartBtn" hidden>PR over time</button>
        </div>
      </section>
    </main>
  </div>

  <div class="pr-chart-dialog" id="prChartDialog" role="dialog" aria-modal="true" aria-labelledby="prChartTitle" hidden>
    <div class="pr-chart-box">
      <div class="pr-chart-head">
        <div>
          <div class="quiz-question" id="prChartTitle">PR over time</div>
          <div class="meta" id="prChartNote">Lower is better. Each dot is a match; hollow dots are unfinished matches.</div>
        </div>
        <button type="button" class="secondary" id="prChartCloseBtn">Close</button>
      </div>
      <div class="pr-chart" id="prChart"></div>
    </div>
  </div>

  <script src="engine/bghelmet.js"></script>
  <script src="shared/engineBudget.js"></script>
  <script src="engineBridge.js"></script>
  <script src="shared/ogid.js"></script>
  <script src="shared/checkerPlay.js"></script>
  <script src="shared/analysisText.js"></script>
  <script type="module" src="play.js"></script>
</body>

</html>
